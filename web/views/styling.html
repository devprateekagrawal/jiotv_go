{{ define "styling" }}
<script>
  // Set the theme before the stylesheet loads to prevent a flash of the
  // default palette while common.js is still waiting at the end of <body>.
  (() => {
    try {
      // Dark unless the user picked light with the toggle: TV browsers often
      // report a light system theme, and dark suits a TV room better.
      const theme = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (_) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<link href="/static/internal/tailwind.css" rel="stylesheet" />
<link href="/static/internal/tv.css" rel="stylesheet" />
{{ end }}
